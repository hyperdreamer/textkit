# Server bind address. Defaults to "127.0.0.1" when omitted.
# Use "0.0.0.0" only on a trusted network; the backend exposes local AI APIs.
host: "127.0.0.1"

# Server port. Defaults to 8765 when omitted.
port: 8765

# Basic request limits to avoid unbounded memory use and accidental large
# provider calls. Set a limit to 0 to disable it.
# Valid range: 0-104857600 bytes; 0 disables the upload limit.
max_upload_bytes: 15728640
# Valid range: 0-200000000 pixels; 0 disables the image pixel limit.
max_image_pixels: 40000000
# Valid range: 0-2000000 characters; 0 disables the text limit.
max_text_chars: 200000
# Valid range: 0-100000 characters; 0 disables the prompt limit.
max_prompt_chars: 20000
# Valid range: 0-20971520 bytes; 0 disables the request body limit.
max_request_body_bytes: 2097152

# In-process abuse controls for AI calls. For multi-worker
# deployments, put an equivalent shared limiter at the reverse proxy as well.
# Valid range: 0-10000; 0 disables the per-minute request limit.
requests_per_minute: 60
# Valid range: 0-100; 0 disables the concurrent request limit.
max_concurrent_requests: 4

# Enable debug logging to stderr for OCR / dedup / translate requests. This also
# writes sensitive last_screenshot.png, last_ocr.txt, pre_dedup.txt, and
# after_dedup.txt files to a mode-0700 textkit-debug-* directory under the OS
# temporary directory. Files are overwritten by later requests but the private
# directory persists after backend exit until manually removed or temp cleanup.
# debug: false

# AI API settings — OpenAI Chat Completions by default, with optional
# OpenAI Responses or Anthropic Messages.
ai:
  # Base URL for the provider API, without a trailing slash.  Trailing slashes
  # are stripped before the endpoint is appended, so gateway prefixes such as
  # https://gateway.example.com/openai survive in both modes.
  # A base that already ends in /v1 is not normalized: legacy mode appends
  # /v1/chat/completions verbatim, producing a doubled /v1/v1 segment.
  api_base: "https://api.openai.com"

  # API key for the provider. Plaintext values are used directly.
  # Prefix with ``$`` to treat the value as an environment variable name
  # (e.g. ``$OCR_API_KEY`` resolves ``os.getenv("OCR_API_KEY")``).
  # Alternatively set ``api_key_env`` to the name of an environment variable.
  # The backend also falls back to OCR_API_KEY and provider-specific defaults.
  # Examples: $OCR_API_KEY, $OPENAI_API_KEY.
  api_key: "$OCR_API_KEY"

  # Upstream protocol.  Omit this key to keep the legacy behaviour: the backend
  # appends /v1/chat/completions verbatim to the validated api_base (there is no
  # standalone /v1 auto-append and no path normalization).  An explicit value
  # selects one of exactly three protocols:
  #
  #   /v1/chat/completions  OpenAI Chat Completions
  #   /v1/responses         OpenAI Responses
  #   /v1/messages          Anthropic Messages
  #
  # The explicit endpoint is appended to api_base after trailing slashes are
  # removed, so gateway path prefixes are preserved.  Any other value — null, a
  # non-string, an alias, or a full URL — is a configuration error: startup
  # refuses to run, and a later edit fails the next request with a structured
  # 500 instead of calling the provider.
  #
  # Auth differs by protocol: both OpenAI protocols send
  # Authorization: Bearer <key>; Messages sends x-api-key: <key> together with
  # anthropic-version: 2023-06-01.
  #
  # This field belongs to the base ai section only; ai.ocr and ai.text cannot
  # override it.
  # endpoint: "/v1/chat/completions"

  # Token cap used only by Anthropic Messages, and only when no positive
  # effective max_tokens exists.  OpenAI protocols ignore it.  Must be a strict
  # positive integer (Booleans, strings, fractions, and null are rejected).
  # messages_default_max_tokens: 4096

  # Vision-capable model name to use when no per-task override specifies one.
  model: "gpt-4.1-mini"

  # Optional completion-token cap.  Chat sends it as ``max_tokens``, Responses
  # as ``max_output_tokens``, and Messages as ``max_tokens`` (falling back to
  # messages_default_max_tokens).  Set it when a reasoning model exhausts a
  # provider default and truncates long output; the /format and /translate
  # pipelines also recover from truncation by splitting the text.
  # max_tokens: 32000

  # Per-task model/API overrides (optional).  Every field is optional — empty
  # fields inherit from the parent ``ai`` section.  You can override the model
  # or provider base URL for a specific task, but not the protocol endpoint:
  # ai.endpoint is a base ``ai`` field and the override model rejects it.
  #
  # ocr:                    # OCR-specific overrides
  #   model: "gpt-4.1"      # vision-capable model for OCR
  #
  # text:                   # text-processing overrides (dedup + translate + format)
  #   api_base: "https://other-proxy.example.com"
  #   max_tokens: 32000     # completion-token cap for text tasks
  #   api_key: "$OTHER_PROXY_API_KEY"
  #   model: "claude-sonnet-4-20250514"

  # HTTP is accepted for any provider host. Non-loopback HTTP is unencrypted and
  # the backend logs a startup warning at config load; prefer HTTPS.
  # Per-phase HTTP timeouts for AI API calls (all in seconds).
  # Omit any key to use its default.  Increase ``read`` when translating
  # very long text that may take the model several minutes to process.
  # timeout:
  #   connect: 10    # TCP/TLS handshake (default: 10)
  #   read: 600      # waiting for response body (default: 600 = 10 min)
  #   write: 60      # sending the request body (default: 60)
  #   pool: 10       # acquiring a connection from the pool (default: 10)

# Cache of completed /format and /translate results, stored locally in
# backend/transformation_cache.db (SQLite, WAL mode).  Only an identical request
# identity reuses an entry: operation, exact input text, effective prompt,
# effective text-provider endpoint and model, completion-token cap, target
# language for translation, and internal cache/pipeline revisions.  Prompts,
# input text, API keys, authorization headers, credential-derived values, URLs,
# tab IDs, operation IDs, and readable configuration are never stored; the
# identity digest is the only representation of a request.
#
# Omit this whole mapping, or any individual field, to use the defaults below.
# An explicit ``cache: null`` is a configuration error.  Each value is validated
# strictly: ``enabled`` accepts only a Boolean, and the integers reject Boolean
# values, fractional numbers, numeric strings, and null.
cache:
  # false skips cache initialization, maintenance, lookup, and writes for
  # requests that observe it, and reports ``X-TextKit-Cache: disabled``.
  # Existing rows are retained, not erased, and become reachable again when
  # caching is re-enabled under the then-current TTL and capacity.
  enabled: true

  # Retention window in days, measured from verified generation completion;
  # reads never extend it.  Valid range: 1-3650.  Expiry affects logical
  # availability only, not physical erasure or file shrinkage.
  ttl_days: 30

  # Maximum stored rows shared by /format and /translate.  When exceeded, the
  # oldest generation timestamps are evicted first.  Valid range: 1-100000.
  max_entries: 1000
