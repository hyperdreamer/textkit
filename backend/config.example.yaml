# Server bind address. Defaults to "127.0.0.1" when omitted.
# Use "0.0.0.0" only on a trusted network; the backend exposes local AI APIs.
host: "127.0.0.1"

# Server port. Defaults to 8765 when omitted.
port: 8765

# Basic request limits to avoid unbounded memory use and accidental large
# provider calls. Set a limit to 0 to disable it.
# Valid range: 0-104857600 bytes; 0 disables the upload limit.
max_upload_bytes: 15728640
# Valid range: 0-200000000 pixels; 0 disables the image pixel limit.
max_image_pixels: 40000000
# Valid range: 0-2000000 characters; 0 disables the text limit.
max_text_chars: 200000
# Valid range: 0-100000 characters; 0 disables the prompt limit.
max_prompt_chars: 20000
# Valid range: 0-20971520 bytes; 0 disables the request body limit.
max_request_body_bytes: 2097152

# In-process abuse controls for AI calls. For multi-worker
# deployments, put an equivalent shared limiter at the reverse proxy as well.
# Valid range: 0-10000; 0 disables the per-minute request limit.
requests_per_minute: 60
# Valid range: 0-100; 0 disables the concurrent request limit.
max_concurrent_requests: 4

# Enable debug logging to stderr for OCR / dedup / translate requests. This also
# writes sensitive last_screenshot.png, last_ocr.txt, pre_dedup.txt, and
# after_dedup.txt files to a mode-0700 textkit-debug-* directory under the OS
# temporary directory. Files are overwritten by later requests but the private
# directory persists after backend exit until manually removed or temp cleanup.
# debug: false

# AI API settings — uses an OpenAI-compatible chat completions API.
ai:
  # Base URL for the provider API, without a trailing slash; trailing slashes are
  # removed before the protocol path is appended. Omitting it defaults to
  # https://api.openai.com in both legacy and explicit modes.
  api_base: "https://api.openai.com"

  # Upstream protocol selection (optional).
  #
  # Omit this key to keep the legacy behaviour: the backend appends
  # /v1/chat/completions verbatim to the validated api_base. There is no
  # standalone "/v1" auto-append and no path normalization, so a base that
  # already ends in /v1 produces a doubled /v1/v1 segment exactly as before.
  #
  # Accepted values are exactly these three strings:
  #   /v1/chat/completions  OpenAI Chat Completions
  #   /v1/responses         OpenAI Responses
  #   /v1/messages          Anthropic Messages
  #
  # Any other value — null, a non-string, an alias such as "chat/completions",
  # or a full URL — is a configuration error: startup refuses to run, and an
  # invalid edit to a running backend fails the next request with the usual
  # structured 500 envelope instead of calling the provider.
  #
  # Authentication follows the protocol: both OpenAI protocols send
  # Authorization: Bearer <key>, while Messages sends x-api-key plus
  # anthropic-version: 2023-06-01.
  #
  # This is a base "ai" field only; ai.ocr and ai.text cannot override it.
  # endpoint: "/v1/chat/completions"

  # Mandatory-token fallback for the Anthropic Messages protocol only. Messages
  # requires max_tokens on every request, so this value is used when no positive
  # ai.max_tokens or per-task max_tokens applies. Strict positive integer.
  # messages_default_max_tokens: 4096

  # API key for the provider. Plaintext values are used directly.
  # Prefix with ``$`` to treat the value as an environment variable name
  # (e.g. ``$OCR_API_KEY`` resolves ``os.getenv("OCR_API_KEY")``).
  # Alternatively set ``api_key_env`` to the name of an environment variable.
  # The backend also falls back to OCR_API_KEY and provider-specific defaults.
  # Examples: $OCR_API_KEY, $OPENAI_API_KEY.
  api_key: "$OCR_API_KEY"

  # Vision-capable model name to use when no per-task override specifies one.
  model: "gpt-4.1-mini"

  # Optional completion-token cap sent as ``max_tokens``.  Set it when a
  # reasoning model exhausts a provider default and truncates long output; the
  # /format and /translate pipelines also recover from truncation by splitting
  # the text.
  # max_tokens: 32000

  # Per-task model/API overrides (optional).  Every field is optional — empty
  # fields inherit from the parent ``ai`` section.  You can override the model
  # or API endpoint for a specific task.
  #
  # ocr:                    # OCR-specific overrides
  #   model: "gpt-4.1"      # vision-capable model for OCR
  #
  # text:                   # text-processing overrides (dedup + translate + format)
  #   api_base: "https://other-proxy.example.com"
  #   max_tokens: 32000     # completion-token cap for text tasks
  #   api_key: "$OTHER_PROXY_API_KEY"
  #   model: "claude-sonnet-4-20250514"

  # HTTP is accepted for any provider host. Non-loopback HTTP is unencrypted and
  # the backend logs a startup warning at config load; prefer HTTPS.
  # Per-phase HTTP timeouts for AI API calls (all in seconds).
  # Omit any key to use its default.  Increase ``read`` when translating
  # very long text that may take the model several minutes to process.
  # timeout:
  #   connect: 10    # TCP/TLS handshake (default: 10)
  #   read: 600      # waiting for response body (default: 600 = 10 min)
  #   write: 60      # sending the request body (default: 60)
  #   pool: 10       # acquiring a connection from the pool (default: 10)
