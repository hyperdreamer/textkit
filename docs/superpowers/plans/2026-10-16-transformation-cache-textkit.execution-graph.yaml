tasks:
  - id: T-001
    plan_task: 1
    title: "Build the Deep SQLite Transformation Cache"
    lane: textkit-sequential
    sequence: 1
    tier: capable
    category: cache-storage
    owns: ["backend/transformation_cache.py", "tests/test_transformation_cache.py"]
    resources: []
    depends_on: []
    interfaces:
      produces: [I-001]
      consumes: []
    validation:
      - argv: ["python", "-m", "pytest", "-q", "tests/test_transformation_cache.py"]
        cwd: "."
        timeout_seconds: 300
  - id: T-002
    plan_task: 2
    title: "Resolve Strict Policy, Prompt, Provider, and Cache Identity Snapshots"
    lane: textkit-sequential
    sequence: 2
    tier: capable
    category: settings-and-identity
    owns: ["backend/main.py", "tests/test_prompt_snapshot.py"]
    resources: []
    depends_on: [T-001]
    interfaces:
      produces: [I-002]
      consumes: [I-001]
    validation:
      - argv: ["python", "-m", "pytest", "-q", "tests/test_prompt_snapshot.py", "tests/test_backend.py", "tests/test_format_pipeline.py", "tests/test_translate_pipeline.py"]
        cwd: "."
        timeout_seconds: 600
  - id: T-003
    plan_task: 3
    title: "Carry Cache Eligibility Through Verified Format and Translation Repair"
    lane: textkit-sequential
    sequence: 3
    tier: capable
    category: pipeline-eligibility
    owns: ["backend/main.py", "tests/test_format_pipeline.py", "tests/test_translate_pipeline.py"]
    resources: []
    depends_on: [T-002]
    interfaces:
      produces: [I-003]
      consumes: [I-002]
    validation:
      - argv: ["python", "-m", "pytest", "-q", "tests/test_format_pipeline.py", "tests/test_translate_pipeline.py"]
        cwd: "."
        timeout_seconds: 600
  - id: T-004
    plan_task: 4
    title: "Integrate Force, Cache Transactions, Headers, and Endpoint Ordering"
    lane: textkit-sequential
    sequence: 4
    tier: capable
    category: endpoint-contract
    owns: ["backend/main.py", "tests/test_transformation_endpoints.py"]
    resources: []
    depends_on: [T-003]
    interfaces:
      produces: [I-004]
      consumes: [I-001, I-002, I-003]
    validation:
      - argv: ["python", "-m", "pytest", "-q", "tests/test_transformation_endpoints.py", "tests/test_prompt_snapshot.py", "tests/test_transformation_cache.py", "tests/test_format_pipeline.py", "tests/test_translate_pipeline.py", "tests/test_backend.py"]
        cwd: "."
        timeout_seconds: 900
  - id: T-005
    plan_task: 5
    title: "Document Local Retention, Headers, Configuration, and Verification"
    lane: textkit-sequential
    sequence: 5
    tier: standard
    category: documentation-and-verification
    owns: ["backend/config.example.yaml", ".gitignore", "README.md"]
    resources: []
    depends_on: [T-004]
    interfaces:
      produces: []
      consumes: [I-004]
    validation:
      - argv: ["python", "-m", "pytest", "-q", "tests/test_transformation_cache.py", "tests/test_transformation_endpoints.py", "tests/test_prompt_snapshot.py", "tests/test_format_pipeline.py", "tests/test_translate_pipeline.py"]
        cwd: "."
        timeout_seconds: 900
      - argv: ["python", "-m", "pytest", "-q", "tests/"]
        cwd: "."
        timeout_seconds: 1200
