    sha256: 34cd2fef79a3769114522d5c88e9c6676dffe5094e55577288df506e987ba5a6
    producer: T-002
  - id: I-003
    name: PipelineOutcome
    signature: "PipelineOutcome = frozen { response: OCRResponse, eligible: bool, degraded: bool }; execute_format(settings, text) and execute_translate(settings, text, language) preserve acceptance metadata through recursive repair."
    sha256: dd0c04322b6e6b0bd6cdaaf283f26f0fb9f6cdeb200f4bd4d23bc2a309ffcfda
    producer: T-003
  - id: I-004
    name: TextKitTransformationEndpoint
    signature: "TextKit transformation endpoints accept optional Boolean force=false, preserve existing JSON fields, and add successful-response X-TextKit-Cache values skipped, disabled, hit, error, uncacheable, refresh, or miss; non-success responses omit the header."
    sha256: e9f24cb7fdfdc2c805b0ff6ed0cf285aba29dc559179e6277e866a69dd0dff60
    producer: T-004
